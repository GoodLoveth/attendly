
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — Attendly</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .report-filters {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: end;
        }

        .report-filters .form-group {
            min-width: 0;
        }

        .report-result {
            margin-top: 22px;
            min-width: 0;
        }

        .report-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .report-stat,
        .summary-box {
            min-width: 0;
            padding: 16px;
            border: 1px solid #e5eaf0;
            border-radius: 10px;
            background: #fff;
        }

        .report-stat span,
        .summary-box small {
            display: block;
            color: #718096;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .report-stat strong,
        .summary-box strong {
            font-size: 23px;
            overflow-wrap: anywhere;
        }

        .report-student {
            padding: 20px;
            background: #f7f9fc;
            border-radius: 10px;
        }

        .report-student h2 {
            margin: 0 0 12px;
        }

        .report-student p {
            margin: 7px 0;
            color: #64748b;
            overflow-wrap: anywhere;
        }

        #reportLoading {
            display: none;
            padding: 18px 0;
            color: #64748b;
        }

        #reportResult .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        #reportResult table {
            width: 100%;
        }

        @media (max-width: 700px) {
            .report-filters {
                grid-template-columns: 1fr;
            }

            .report-summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .report-filters .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <a class="sidebar-brand" href="dashboard.html">
            <span class="mini-logo">
                <img src="./assets/attendly-removebg.png" alt="Attendly logo">
            </span>
            <strong>Attendly</strong>
        </a>

        <nav class="sidebar-nav">
            <div class="nav-section">Main Menu</div>

            <a class="nav-item" href="dashboard.html">
                <span class="nav-icon">▦</span>Dashboard
            </a>

            <a class="nav-item" href="students.html">
                <span class="nav-icon">♙</span>Students
            </a>

            <a class="nav-item" href="attendance.html">
                <span class="nav-icon">✓</span>Attendance
            </a>

            <a class="nav-item" href="attendance-history.html">
                <span class="nav-icon">◷</span>Attendance History
            </a>

            <a class="nav-item active" href="reports.html">
                <span class="nav-icon">▤</span>Reports
            </a>

            <a class="nav-item" href="settings.html">
                <span class="nav-icon">⚙</span>Settings
            </a>
        </nav>

        <div class="sidebar-user">
            <div class="avatar" data-user-initials>AU</div>
            <div class="user-meta">
                <strong data-user-name>Admin User</strong>
                <span data-user-role>Lecturer</span>
            </div>
        </div>

        <button type="button" class="btn btn-outline" data-logout
            style="margin:15px;width:calc(100% - 30px);">
            Logout
        </button>
    </aside>

    <div class="overlay"></div>

    <main class="main">
        <header class="topbar">
            <button type="button" class="menu-btn" aria-label="Open menu">
                ☰
            </button>

            <div class="search-wrap">
                <span>⌕</span>
                <input class="global-search" placeholder="Search anything...">
            </div>

            <div class="topbar-spacer"></div>

            <button type="button" class="top-icon" aria-label="Notifications">
                ♧<i class="dot"></i>
            </button>

            <div class="profile-menu">
                <div class="avatar" data-user-initials>AU</div>
                <span data-user-name>Admin User</span>
            </div>
        </header>

        <section class="page">
            <div class="page-head">
                <div>
                    <h1>Reports</h1>
                    <p>View and review student attendance reports.</p>
                </div>
            </div>

            <div class="card">
                <div class="card-pad">
                    <h3 class="card-title" style="margin-bottom:18px;">
                        Student Attendance Report
                    </h3>

                    <div class="report-filters">
                        <div class="form-group">
                            <label class="form-label" for="studentSelect">
                                Select Student
                            </label>

                            <select id="studentSelect" class="form-control">
                                <option value="">Loading students...</option>
                            </select>
                        </div>

                        <button type="button" class="btn btn-primary"
                            onclick="document.getElementById('studentSelect').dispatchEvent(new Event('change'))">
                            Generate Report
                        </button>
                    </div>

                    <p id="reportLoading" role="status">
                        Loading attendance report...
                    </p>
                </div>
            </div>

            <div id="reportResult" class="report-result" aria-live="polite">
                <div class="card card-pad">
                    <p>Select a student to view their attendance report.</p>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
