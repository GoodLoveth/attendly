<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0"
    >

    <title>Register — Attendly</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


    <section class="auth-visual">

        <div class="brand-lockup">

            <div class="brand-mark">

                <img
                    src="./assets/attendly-removebg.png"
                    alt="Attendly logo"
                >

            </div>

            <h1>
                Attendly
            </h1>

            <p>
                Track Attendance. Build Success.
            </p>

            <img
                src="assets/books-removebg.png"
                alt="book vector image"
                height="150px"
                style="margin-top:60px;"
            >

            <div
                style="
                    font-size:72px;
                    margin-top:35px;
                "
            ></div>

        </div>

    </section>


    <section class="auth-card-wrap">

        <div class="auth-card">

            <h2>
                Create Your Account
            </h2>

            <p class="auth-subtitle">
                Join us and start managing attendance
            </p>


            <!-- IMPORTANT: registerForm ID -->
            <form id="registerForm">


                <div class="form-group">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        id="name"
                        name="name"
                        class="form-control"
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        class="form-control"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="password-wrap">

                        <input
                            id="password"
                            name="password"
                            class="form-control"
                            type="password"
                            placeholder="Create a password"
                            required
                            minlength="6"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <div class="password-wrap">

                        <input
                            id="confirmPassword"
                            name="confirmPassword"
                            class="form-control"
                            type="password"
                            placeholder="Confirm your password"
                            required
                            minlength="6"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                >
                    Register
                </button>


                <p
                    id="registerMessage"
                    style="
                        margin-top:15px;
                        text-align:center;
                    "
                ></p>


            </form>


            <div class="auth-footer">

                Already have an account?

                <a
                    class="text-link"
                    href="index.html"
                >
                    Login
                </a>

            </div>

        </div>

    </section>


    <script src="app.js"></script>

</body>

</html>
